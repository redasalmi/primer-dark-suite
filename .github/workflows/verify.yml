name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Validate shell scripts and theme assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The checks run in Fedora 44 because it matches the validated GTK 4.22
      # target: the GTK 4 stylesheet needs GTK 4.20 or newer, while the default
      # Ubuntu runner ships GTK 4.14. ShellCheck lints the shell scripts,
      # libxml2 provides xmllint for the KDE SVGs and the bat theme, jq parses
      # the JSON assets, and PyGObject with the Gtk 3.0 and 4.0 typelibs runs
      # the native CSS parsers used by the GTK validation hook, and fish parses
      # the fish fzf snippet.
      - name: Validate shell scripts and theme assets
        run: |
          docker run --rm -v "$PWD:/src" -w /src fedora:44 sh -c '
            dnf install -y ShellCheck libxml2 jq python3-gobject gtk3 gtk4 fish &&
            shellcheck install.sh uninstall.sh scripts/check.sh scripts/lib/*.sh scripts/components/*.sh cli/fzf/primer-dark.sh &&
            ./scripts/check.sh'
