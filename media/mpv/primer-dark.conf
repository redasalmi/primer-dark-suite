# Primer Dark for mpv
# SPDX-License-Identifier: MIT
#
# mpv has no theme file. Include this snippet from ~/.config/mpv/mpv.conf with
#     include="~~/primer-dark.conf"
# after copying it to ~/.config/mpv/primer-dark.conf, or paste the lines into
# mpv.conf. Only the OSD, on-screen controller, and console colors are set;
# subtitle colors belong to the media and are left untouched.
#
# mpv option colors use #AARRGGBB; script options use #RRGGBB. osd-back-color
# is the Primer inset surface at 80% opacity. mpv only draws it with a box
# border style or a nonzero osd-shadow-offset, so it has no effect with the
# default outline style. Add osd-border-style=background-box to mpv.conf for a
# backdrop behind OSD text.

osd-color="#F0F6FC"
osd-outline-color="#010409"
osd-back-color="#CC010409"
osd-selected-color="#4493F8"
osd-selected-outline-color="#010409"

script-opts-append="osc-background_color=#010409"
script-opts-append="osc-timecode_color=#F0F6FC"
script-opts-append="osc-title_color=#F0F6FC"
script-opts-append="osc-time_pos_color=#F0F6FC"
script-opts-append="osc-time_pos_outline_color=#010409"
script-opts-append="osc-buttons_color=#F0F6FC"
script-opts-append="osc-small_buttonsL_color=#9198A1"
script-opts-append="osc-small_buttonsR_color=#9198A1"
script-opts-append="osc-top_buttons_color=#9198A1"
script-opts-append="osc-held_element_color=#4493F8"

script-opts-append="console-menu_outline_color=#3D444D"
script-opts-append="console-focused_color=#FFFFFF"
script-opts-append="console-focused_back_color=#1F6FEB"
script-opts-append="console-match_color=#4493F8"
