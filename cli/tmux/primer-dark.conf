# Primer Dark for tmux
# SPDX-License-Identifier: MIT
#
# tmux has no theme discovery. Add this line to ~/.tmux.conf and reload with
# `tmux source-file ~/.tmux.conf`:
#     source-file /path/to/primer-dark.conf
#
# Only styles are set here, so your status format, key bindings, and other
# settings are preserved.

# Status bar
set -g status-style "bg=#010409,fg=#9198A1"
set -g status-left-style "bg=#1F6FEB,fg=#FFFFFF,bold"
set -g status-right-style "bg=#010409,fg=#9198A1"

# Window list
set -g window-status-style "fg=#9198A1"
set -g window-status-current-style "bg=#212830,fg=#F0F6FC,bold"
set -g window-status-activity-style "fg=#D29922"
set -g window-status-bell-style "fg=#F85149,bold"
set -g window-status-separator " "

# Pane borders
set -g pane-border-style "fg=#3D444D"
set -g pane-active-border-style "fg=#1F6FEB"

# Messages and command prompt
set -g message-style "bg=#051D4D,fg=#F0F6FC"
set -g message-command-style "bg=#051D4D,fg=#79C0FF"

# Copy mode selection
set -g mode-style "bg=#1F6FEB,fg=#FFFFFF"

# Menus
set -g menu-style "bg=#0D1117,fg=#F0F6FC"
set -g menu-selected-style "bg=#1F6FEB,fg=#FFFFFF"
set -g menu-border-style "fg=#3D444D"

# Popups
set -g popup-style "bg=#0D1117,fg=#F0F6FC"
set -g popup-border-style "fg=#3D444D"

# Clock and pane indicators
set -g clock-mode-colour "#4493F8"
set -g display-panes-colour "#3D444D"
set -g display-panes-active-colour "#4493F8"
