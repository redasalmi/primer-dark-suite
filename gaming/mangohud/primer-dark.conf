# Primer Dark for MangoHud
# SPDX-License-Identifier: MIT
#
# MangoHud has no theme file; colors are ordinary options in its shared
# configuration, which GOverlay also rewrites. Append these lines to
# ~/.config/MangoHud/MangoHud.conf (or a per-application
# ~/.config/MangoHud/<app>.conf), replacing any existing color lines, or try
# them for one game with:
#     MANGOHUD_CONFIGFILE=/path/to/primer-dark.conf mangohud <game>
#
# MangoHud colors are RRGGBB without "#". Load and FPS thresholds read
# good-to-bad for load (low, medium, high) and bad-to-good for FPS.

text_color=F0F6FC
text_outline_color=010409
background_color=010409
background_alpha=0.8
gpu_color=3FB950
cpu_color=4493F8
vram_color=AB7DF8
ram_color=DB61A2
engine_color=F85149
io_color=D2A8FF
frametime_color=39C5CF
media_player_color=F0F6FC
wine_color=FF7B72
battery_color=FFA657
network_color=79C0FF
horizontal_separator_color=3D444D
gpu_load_color=3FB950,D29922,F85149
cpu_load_color=3FB950,D29922,F85149
fps_color=F85149,D29922,3FB950
