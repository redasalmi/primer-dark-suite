name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Validate shell scripts and theme assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # xmllint validates the KDE SVGs and the bat theme, and is not part of the
      # runner image. See https://github.com/actions/runner-images/issues/12876
      - name: Install xmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Check shell scripts
        run: >-
          shellcheck
          install.sh
          uninstall.sh
          scripts/check.sh
          scripts/lib/*.sh
          scripts/components/*.sh
          cli/fzf/primer-dark.sh

      - name: Validate theme assets
        run: ./scripts/check.sh
